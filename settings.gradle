pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name "kikugieMavenReleases"
			url "https://maven.kikugie.dev/releases"
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id("dev.kikugie.stonecutter").version "0.9"
}

stonecutter {
	// Enable Groovy DSL, as Stonecutter uses Kotlin by default
	kotlinController = false
	centralScript = "build.gradle"

	// Configuration goes here
	create(getRootProject()) {
		versions "1.21.11", "1.21.10", "1.21.8", "1.21.5"
		vcsVersion = "1.21.11"
	}
}

include("versions:1.21.5")
include("versions:1.21.8")
include("versions:1.21.10")
include("versions:1.21.11")